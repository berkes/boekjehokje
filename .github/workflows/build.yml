# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow runs format checks, lint, and a build on every
# push and pull request. On a successful build of a pushed tag, it deploys
# the contents of ./dist to GitHub Pages. Every run also executes the
# Playwright E2E suite against a WireMock container.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
    tags: ["v*"]

  pull_request:

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Install dependencies
        run: deno install

      - name: Verify formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Run build
        run: deno task build
        env:
          VITE_BASE: /boekjehokje/
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Setup Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Runs the Playwright E2E suite against a WireMock container that mocks
  # the Google APIs (ADR-0001). The Deno version is pinned to a combination
  # known to work with Playwright (denoland/deno#27623, #31595).
  #
  # The mock runs as a service container. Service containers start before
  # the job's steps, so e2e/wiremock cannot be mounted into it; instead a
  # job step uploads the stubs through WireMock's admin API.
  e2e:
    runs-on: ubuntu-latest
    services:
      google-mock:
        image: wiremock/wiremock:3x
        ports:
          - 8081:8080
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7

      - name: Install dependencies
        run: deno install

      - name: Type-check the E2E suite
        run: >
          deno check e2e/playwright.config.ts e2e/fixtures/auth.ts
          e2e/pages/*.ts e2e/tests/*.spec.ts

      - name: Install the Playwright browser
        run: deno run -A npm:@playwright/test install --with-deps chromium

      - name: Wait for the mock to become healthy
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8081/__admin/health > /dev/null; then
              echo "WireMock is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "WireMock did not become healthy in time"
          exit 1

      - name: Load the Google API stubs into the mock
        run: |
          curl -fsS -X PUT -H 'Content-Type: text/plain' \
            --data-binary @e2e/wiremock/__files/calendar-events.hbs \
            http://localhost:8081/__admin/files/calendar-events.hbs
          for mapping in e2e/wiremock/mappings/*.json; do
            curl -fsS -X POST -H 'Content-Type: application/json' \
              --data-binary @"$mapping" \
              http://localhost:8081/__admin/mappings
          done

      - name: Run the E2E suite
        run: deno task test:e2e
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
